<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Body -->
  <ellipse cx="60" cy="72" rx="38" ry="36" fill="#1a1a1a"/>
  <!-- Belly -->
  <ellipse cx="60" cy="78" rx="24" ry="22" fill="#F5F5F0"/>
  <!-- Head -->
  <circle cx="60" cy="36" r="28" fill="#F5F5F0"/>
  <circle cx="60" cy="36" r="28" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Left ear -->
  <circle cx="38" cy="14" r="12" fill="#1a1a1a"/>
  <!-- Right ear -->
  <circle cx="82" cy="14" r="12" fill="#1a1a1a"/>
  <!-- Left eye patch -->
  <ellipse cx="48" cy="32" rx="8" ry="10" fill="#1a1a1a" transform="rotate(-10,48,32)"/>
  <!-- Right eye patch -->
  <ellipse cx="72" cy="32" rx="8" ry="10" fill="#1a1a1a" transform="rotate(10,72,32)"/>
  <!-- Left eye -->
  <circle cx="50" cy="30" r="3.5" fill="#F5F5F0"/>
  <!-- Right eye -->
  <circle cx="70" cy="30" r="3.5" fill="#F5F5F0"/>
  <!-- Left pupil -->
  <circle cx="51" cy="31" r="1.8" fill="#1a1a1a"/>
  <!-- Right pupil -->
  <circle cx="69" cy="31" r="1.8" fill="#1a1a1a"/>
  <!-- Nose -->
  <ellipse cx="60" cy="40" rx="4" ry="3" fill="#FF8FAB"/>
  <!-- Mouth -->
  <path d="M55 44 Q60 48 65 44" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Left arm -->
  <ellipse cx="28" cy="66" rx="14" ry="10" fill="#1a1a1a" transform="rotate(-20,28,66)"/>
  <!-- Right arm -->
  <ellipse cx="92" cy="66" rx="14" ry="10" fill="#1a1a1a" transform="rotate(20,92,66)"/>
  <!-- Left foot -->
  <ellipse cx="40" cy="104" rx="15" ry="9" fill="#1a1a1a"/>
  <!-- Right foot -->
  <ellipse cx="80" cy="104" rx="15" ry="9" fill="#1a1a1a"/>
  <!-- Foot pads -->
  <ellipse cx="40" cy="102" rx="8" ry="5" fill="#FF8FAB"/>
  <ellipse cx="80" cy="102" rx="8" ry="5" fill="#FF8FAB"/>
</svg>
