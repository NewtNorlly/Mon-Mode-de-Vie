<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Sky gradient background hint -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F4E8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="1" x2="0" y2="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="120" fill="url(#sky)" rx="16"/>
  <!-- Back mountain -->
  <path d="M-10 120 L30 35 L80 55 L130 25 L180 50 L210 120 Z" fill="#8CB8C8" opacity="0.5"/>
  <!-- Middle mountain -->
  <path d="M-10 120 L50 50 L100 70 L150 40 L210 120 Z" fill="#6BA3B5" opacity="0.6"/>
  <!-- Front mountain -->
  <path d="M-10 120 L60 60 L120 80 L180 45 L210 120 Z" fill="#4A8B9E" opacity="0.7"/>
  <!-- Mist layer -->
  <rect x="0" y="75" width="200" height="45" fill="url(#mist)" rx="0 0 16 16"/>
  <!-- Sun -->
  <circle cx="160" cy="30" r="14" fill="#FFD89B" opacity="0.7"/>
</svg>
