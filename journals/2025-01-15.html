<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="../index.html#journal/2025-01-15"><title>2025年1月15日 · Journal · Mon Mode de Vie</title><style>html{background:#ece9e1}body{margin:0;visibility:hidden}</style><script>location.replace("../index.html#journal/2025-01-15")</script></head><body><article class="journal-article"><header class="journal-header"><p class="kicker">Journal · 2025-01-15</p><h1><time datetime="2025-01-15">2025年1月15日</time></h1><p class="subtitle">湖北省武汉市</p></header><section class="prose journal-original-text" lang="zh-CN" data-journal-original><p>浔阳江头，</p><p>列车北上，</p><p>蓦然回首，</p><p>我才意识到：</p><p>回浔阳看牙医，</p><p>又累又无聊！</p><p>关键还占用时间！</p><p>趁现在还很无聊，</p><p>就清理一下没用的截屏</p><p>我记得，有个B站UP主叫“魏都人”，估计是摄影师或剪辑师。点开主页看一眼，你会发现，他把哔哩当网盘了！</p><p>深有同感啊，手机系统相册的好多照片，很有时代价值，但都成故纸堆了。干脆把它们丢到公共网络空间里，再从手机中删掉！</p></section><div class="journal-media-prose"><figure><img src="./assets/images/2025-01-15-1.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-2.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-3.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-4.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-5.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-6.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-7.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-8.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-9.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-01-15-10.jpg" alt="" loading="lazy" decod
