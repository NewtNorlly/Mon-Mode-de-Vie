<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="../index.html#journal/2025-05-20"><title>2025年5月20日 · Journal · Mon Mode de Vie</title><style>html{background:#ece9e1}body{margin:0;visibility:hidden}</style><script>location.replace("../index.html#journal/2025-05-20")</script></head><body><article class="journal-article"><header class="journal-header"><p class="kicker">Journal · 2025-05-20</p><h1><time datetime="2025-05-20">2025年5月20日</time></h1><p class="subtitle">湖北省武汉市</p></header><section class="prose journal-original-text" lang="zh-CN" data-journal-original><p>独夜无伴守灯下，春风对面吹。</p><p>此刻今宵仍懵懂，遇着少年家。</p><p>果然标致面糯白，谁家人子弟？</p><p>想要问伊惊歹势，心内弹琵琶。</p><p>想要开函见君容，意爱在心内。</p><p>等待何时君来访？青春花当开。</p><p>听见外面有人来，开门看着觅。</p><p>月亮笑侬是呆呆，被风骗不知。</p><p>花开当折直须摘，青春最可爱！</p><p>只为人生不重来，何不放开怀？</p></section><div class="journal-media-prose"><figure><img src="./assets/images/2025-05-20-1.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-2.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-3.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-4.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-5.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-6.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-7.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-8.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-9.jpg" alt="" loading="lazy" decoding="async"></figure><figure><img src="./assets/images/2025-05-20-10.jpg" alt="" loading="lazy" decoding="async"></figure></div></artic
