        <p data-journal-block-id="b01" data-journal-block-index="0">7月1号，紫菘公寓组织搬寝室，因为部分公寓楼暑假会翻修。我就把暑期不需要的衣物和其他用品，搬到了百惠园食堂3楼，光是整理、打包、搬运，就花了我一个白天的时间，要命啊，累得走不动了都。</p>
