      window.location.replace('https://www.google.com/search?q=site:newtnorlly.xyz+' + encodeURIComponent(q));

      document.write('<p style="text-align:center;margin-top:40vh;font-family:sans-serif;color:#666;">在 DuckDuckGo 中输入 <code>!mmdv 关键词</code> 即可搜索本站内容。</p>');
